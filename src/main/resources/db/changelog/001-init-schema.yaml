databaseChangeLog:
  - changeSet:
      id: 1
      author: Aliaksei

      changes:

        - createTable:
            tableName: credentials

            columns:

              - column:
                  name: id
                  type: BIGSERIAL

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT

                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: login
                  type: VARCHAR(255)

                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: password
                  type: VARCHAR(255)

                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(50)

                  constraints:
                    nullable: false